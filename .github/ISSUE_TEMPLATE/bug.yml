name: Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimum sequence of actions that triggers the bug.
      placeholder: |
        1. Run `bun run dev`
        2. Visit /api/health
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Bun version, Node version, OS, browser if relevant.
      placeholder: |
        - Bun: 1.x.x
        - Node: 20.x.x
        - OS: macOS 14.x
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste error output or attach screenshots if helpful.
      render: shell
    validations:
      required: false
