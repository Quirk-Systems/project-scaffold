version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # Majors on peer-coupled packages need coordinated migrations, not
      # auto-bumps: the zod 3->4 solo bump broke every install on main
      # (t3-env 0.11 peer-requires zod ^3). Lift each pin only as part of
      # its migration PR.
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      - dependency-name: "@t3-oss/env-nextjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hookform/resolvers"
        update-types: ["version-update:semver-major"]
      - dependency-name: next-auth
        update-types: ["version-update:semver-major"]
      # eslint 10 removed the legacy rule context API (context.getFilename).
      # eslint-plugin-react — pulled in by eslint-config-next — still peers
      # `eslint: ^9.7` at 7.37.5 and crashes on every React file under 10.
      # Lift when eslint-plugin-react ships eslint 10 support.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      drizzle:
        patterns:
          - "drizzle-*"
          - "better-sqlite3"
          - "@types/better-sqlite3"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "jsdom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
          - "prettier-plugin-tailwindcss"
      linting:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
      include: scope
