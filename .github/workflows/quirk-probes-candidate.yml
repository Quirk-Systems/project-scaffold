name: Quirk Probes Candidate

on:
  pull_request:
    paths:
      - "evals/quirk-probes/**"
      - "evals/session-composition/gate.mjs"
      - "evals/session-composition/run.mjs"
      - "evals/session-composition/fixtures.json"
      - "evals/session-composition/probe.test.mjs"
      - ".github/workflows/quirk-probes-candidate.yml"

permissions:
  contents: read

jobs:
  candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Exercise original and reusable candidate probes
        run: node --test evals/session-composition/probe.test.mjs evals/quirk-probes/core.test.mjs evals/quirk-probes/replay.test.mjs
      - name: Replay the complete bound evidence
        run: node evals/quirk-probes/replay.mjs --check
