# Dependabot does not know how to update bun.lock. It edits package.json alone,
# so every such merge lands a manifest that the committed lockfile no longer
# satisfies, and `bun install --frozen-lockfile` — the first step of every CI
# job — fails before anything else runs. That has taken main red four times.
#
# This workflow regenerates the lockfile on the Dependabot branch, before the
# merge, so the drift never reaches main.
name: Dependabot lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json

# No workflow-level permissions: the write scope is granted to the one job that
# needs it and withheld from the one that runs dependency code. See below.
permissions: {}

concurrency:
  group: dependabot-lockfile-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Holds a write token, and therefore must never execute dependency-controlled
  # code. `bun install --lockfile-only` resolves and writes bun.lock without
  # installing anything, so nothing from the dependency tree runs here.
  sync:
    # The PR's author, not the event's actor. `github.actor` is whoever
    # triggered the run, so a maintainer reopening a Dependabot PR — or pushing
    # a manifest tweak to its branch — would skip the sync and leave the
    # lockfile stale, despite `reopened` and `synchronize` being triggers here.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      synced_sha: ${{ steps.sync.outputs.synced_sha }}
    # Dependabot runs get a read-only token by default, because a malicious
    # dependency would otherwise run with write access. Since October 2021 the
    # permissions key is respected for these runs, so this grants exactly the
    # one scope needed to push the lockfile back — and nothing else. That is
    # why this uses `pull_request` rather than `pull_request_target`, which
    # would run with full repository privileges.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch itself, not the merge ref — this job pushes back to it.
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate the lockfile
        run: bun install --lockfile-only

      - name: Refuse to commit anything but the lockfile
        # Defence in depth: the only file this workflow is allowed to change is
        # bun.lock. Anything else means the resolution did something unexpected,
        # and a write-token job should stop rather than commit it.
        run: |
          unexpected="$(git diff --name-only -- . ':!bun.lock')"
          if [ -n "$unexpected" ]; then
            echo "::error::refusing to commit; unexpected changes outside bun.lock:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit and push
        id: sync
        run: |
          if git diff --quiet -- bun.lock; then
            echo "lockfile already matches package.json — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "synced_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun.lock with package.json" -m "skip-checks: true"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "synced_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Note the intentional post-sync check skip
        if: steps.sync.outputs.changed == 'true'
        # The sync commit uses the `skip-checks: true` trailer, so workflow runs
        # that would otherwise be created from the bot-authored synchronize event
        # are skipped intentionally. The read-only jobs below run on that synced
        # SHA and provide the dependency-update evidence instead.
        run: |
          echo "::notice::bun.lock synced and pushed with skip-checks trailer. verify/security/semantic jobs in this workflow now cover the synced SHA."

  # Runs dependency-controlled code — ESLint plugins, the test suite, the Next
  # build — so it is deliberately a separate job with no write scope and no
  # persisted credential. A compromised dependency executing here has nothing
  # to steal and nothing to push with.
  verify:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # e2e runs here too, so it needs the same database CI gives it. Without
    # this job the synced tree gets no e2e coverage at all: the original CI
    # `validate` failed at its frozen install, `e2e` needs it and so never
    # started, and the token push does not re-trigger either of them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact synced commit from the write-scoped sync job.
          ref: ${{ needs.sync.outputs.synced_sha }}
          # actions/checkout stores the token in .git/config by default, where
          # any code running later in the job can read it. This job runs
          # dependency code, so the credential must not be on disk.
          persist-credentials: false

      - name: Prove verify runs on the synced SHA
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ needs.sync.outputs.synced_sha }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::verify checkout SHA $actual does not match synced SHA $expected"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ci.yml pins Node 20 for both its jobs, and this job stands in for them
      # — matching it keeps a passing verify from meaning something different
      # than a passing CI run.
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Prove the drift is gone
        # The exact command that fails on a drifted lockfile, and the first
        # step of every CI job.
        run: bun install --frozen-lockfile

      - name: Verify the update against the real gate
        # Worth the runner minutes on a dependency PR: a lockfile that installs
        # is not the same as a dependency update that works. This is how the
        # plugin-react major was caught — it resolved fine and then vitest
        # could not load its config.
        run: bun run validate
        env:
          SKIP_ENV_VALIDATION: "1"

      - run: bunx playwright install --with-deps

      - name: Verify the update against the e2e gate
        # `validate` stops at the build; `test:e2e` is the other half of
        # `validate:full`. Run it explicitly rather than calling validate:full,
        # which would repeat everything above.
        run: bun run test:e2e
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"

  security:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.synced_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Dependency audit
        run: bun audit --prod

      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@88524578ce32e1a8521c29dd38af9d9200ff92cc
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ needs.sync.outputs.synced_sha }}
          extra_args: --results=verified,unknown

  semantic:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout synced head manifest
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.synced_sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .quirk/manifest.json

      - name: Checkout Quirk semantic core
        uses: actions/checkout@v4
        with:
          repository: Quirk-Systems/.github
          ref: 1263f5008838f743b16ee218046e26dac5c9edd8
          path: .quirk-core
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .quirk/registry.json
            scripts/quirk_concept.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint canonical registry
        run: python .quirk-core/scripts/quirk_concept.py --registry .quirk-core/.quirk/registry.json lint

      - name: Validate repository manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('.quirk/manifest.json')
          if not path.exists():
              raise SystemExit('Missing .quirk/manifest.json')

          data = json.loads(path.read_text(encoding='utf-8'))
          required = ['repository', 'registry', 'policy', 'semantic_impact']
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(f'Manifest missing required keys: {missing}')

          registry = data['registry']
          if registry.get('authority') != 'Quirk-Systems/.github':
              raise SystemExit('Registry authority must be Quirk-Systems/.github')

          mode = data['policy'].get('mode')
          if mode not in {'warn', 'required'}:
              raise SystemExit("policy.mode must be 'warn' or 'required'")

          print(f"Semantic manifest OK: {data['repository']} ({mode})")
