name: deps-audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run mechanical audit
        id: scan
        run: |
          set +e
          bun run deps:audit -- --json artifacts/dependency-audit.json > audit-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload machine-readable report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            artifacts/dependency-audit.json
            audit-report.md
          retention-days: 90
      - name: Upsert canonical audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="quirk-dependency-audit"
          CLEAN=$(jq -r '.clean' artifacts/dependency-audit.json)
          CRITICALS=$(jq -r '.summary.critical' artifacts/dependency-audit.json)
          TITLE="Dependency audit (canonical)"
          if [ "$CRITICALS" -gt 0 ]; then
            TITLE="🚨 $TITLE — CRITICAL advisories open"
          fi
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "\"<!-- $MARKER -->\" in:body" \
            --state all --json number --jq '.[0].number // empty' --limit 1)
          if [ "$CLEAN" = "true" ]; then
            if [ -n "$NUMBER" ]; then
              gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --title "Dependency audit (canonical)" --body-file audit-report.md
              gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --comment "Repository is clean as of this run — closing until findings return."
            fi
            exit 0
          fi
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body-file audit-report.md
            gh issue reopen "$NUMBER" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            if [ "$CRITICALS" -gt 0 ]; then
              gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --add-label security 2>/dev/null || true
            fi
          else
            LABELS="dependencies"
            if [ "$CRITICALS" -gt 0 ]; then LABELS="dependencies,security"; fi
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body-file audit-report.md --label "$LABELS"
          fi
      - name: Enforce escalation policy
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::deps-policy fail-class findings present."
          exit 1
