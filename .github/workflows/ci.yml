name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot-lockfile-precheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_ci: ${{ steps.check.outputs.skip_ci }}
    steps:
      - uses: actions/github-script@v8
        id: check
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("skip_ci", "false");
              return;
            }

            const pr = context.payload.pull_request;
            const isDependabot = pr?.user?.login === "dependabot[bot]";
            const headRef = pr?.head?.ref ?? "";
            const isBunOrNpmBranch =
              headRef.startsWith("dependabot/npm_and_yarn/") || headRef.startsWith("dependabot/bun/");
            if (!isDependabot || !isBunOrNpmBranch) {
              core.setOutput("skip_ci", "false");
              return;
            }

            const files = [];
            for (let page = 1; ; page += 1) {
              const response = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
                page,
              });
              files.push(...response.data);
              if (response.data.length < 100) break;
            }
            const hasPackageJson = files.some(
              (f) => f.filename === "package.json" || f.filename.endsWith("/package.json")
            );
            const hasBunLock = files.some((f) => f.filename === "bun.lock" || f.filename.endsWith("/bun.lock"));

            // Skip CI only for stale Dependabot npm/bun heads before lockfile sync.
            core.setOutput("skip_ci", String(hasPackageJson && !hasBunLock));

  validate:
    needs: dependabot-lockfile-precheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Stale Dependabot dependency head handled elsewhere
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci == 'true'
        run: echo "Skipping CI / validate on stale Dependabot dependency head; Dependabot lockfile / verify validates the synced tree."

      - uses: actions/checkout@v4
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        with:
          node-version: 20

      - run: bun install --frozen-lockfile
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'

      - run: bun run lint
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
      - run: bun run type-check
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
      - run: bun run test:run
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'

      - run: bun run build
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        env:
          SKIP_ENV_VALIDATION: "1"

  e2e:
    needs:
      - dependabot-lockfile-precheck
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Stale Dependabot dependency head handled elsewhere
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci == 'true'
        run: echo "Skipping CI / e2e on stale Dependabot dependency head; Dependabot lockfile / verify validates the synced tree."

      - uses: actions/checkout@v4
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'

      - uses: oven-sh/setup-bun@v2
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        with:
          node-version: 20

      - run: bun install --frozen-lockfile
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
      - run: bunx playwright install --with-deps
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'

      - run: bun run test:e2e
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"

      - name: Upload Playwright report
        if: ${{ !cancelled() && needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  security:
    needs: dependabot-lockfile-precheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Stale Dependabot dependency head handled elsewhere
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci == 'true'
        run: echo "Skipping CI / security on stale Dependabot dependency head; Dependabot lockfile / verify validates the synced tree."

      - uses: actions/checkout@v4
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'

      - name: Dependency audit
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        run: bun audit --prod

      - name: Secret scan (TruffleHog)
        if: needs.dependabot-lockfile-precheck.outputs.skip_ci != 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
