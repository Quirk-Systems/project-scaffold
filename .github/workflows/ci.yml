name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-repair:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 55 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/quirk-foundation-scaffold' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/quirk-foundation-scaffold
          fetch-depth: 0
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - name: Apply generated architecture repairs
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "package.json";
          const manifest = JSON.parse(readFileSync(path, "utf8"));
          manifest.overrides = { ...manifest.overrides, dompurify: "3.4.12" };
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          bun install
          bunx prettier --write tooling/cli/quirk.mjs
          bunx prettier --parser json --write registries/ontology/quirk-core.jsonld
          bun audit --prod
      - name: Commit generated results
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "Quirk Foundation Repair"
          git config user.email "actions@users.noreply.github.com"
          git add package.json bun.lock tooling/cli/quirk.mjs registries/ontology/quirk-core.jsonld
          git commit -m "fix(core): apply generated architecture repairs [foundation-repaired]"
          git push origin HEAD:agent/quirk-foundation-scaffold

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run format:check:foundation
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test:run
      - uses: ./.github/actions/quirk-validate
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      - run: bun run test:e2e
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit --prod
      - name: Secret scan
        uses: trufflesecurity/trufflehog@4d82f215b9ec0bf795ce9955054ec7da3c612ae5
        with:
          extra_args: --results=verified,unknown
