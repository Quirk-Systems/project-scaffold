name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default; jobs opt into checkout's read access only.
permissions: {}

# Requested moving major tags simplify patch maintenance, but SHA pinning
# provides stronger integrity protection; tags are not immutable.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Read access is needed for checkout only; cache/artifact services need no writes.
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # Cache downloads, not node_modules; the frozen install always runs.
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --prefer-offline

      # Exact keys include sources; partial restores keep the same deps/toolchain.
      - name: Cache Next compilation
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-node20-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'components.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-node20-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-

      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type-check
      - name: Unit tests
        run: bun run test:run

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: "1"

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    permissions:
      # Read access is needed for checkout only; cache/artifact services need no writes.
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # Cache downloads, not node_modules; the frozen install always runs.
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --prefer-offline

      # Exact keys include sources; partial restores keep the same deps/toolchain.
      - name: Cache Next compilation
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-node20-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.*', 'tsconfig.json', 'postcss.config.*', 'components.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-node20-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}-

      - name: Resolve installed Playwright version
        id: playwright
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install browser OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps

      - name: Install all browsers and OS dependencies (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps

      - name: End-to-end tests
        run: bun run test:e2e --workers=2
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
          # Mixed zipped traces/HTML benefit from faster, light compression.
          compression-level: 1

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Read access is needed for checkout only; cache/artifact services need no writes.
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --prefer-offline

      - name: Dependency audit
        run: bun audit --prod

      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          version: "3.97.9"
          extra_args: --results=verified,unknown
