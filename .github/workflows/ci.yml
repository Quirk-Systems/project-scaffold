name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate foundation formatting patch
        run: |
          set +e
          bunx prettier --write ".github/actions/**/*.{yml,yaml,md}" ".github/ISSUE_TEMPLATE/**/*.{yml,yaml,md}" ".github/rulesets/**/*.json" ".github/workflows/**/*.{yml,yaml}" ".github/copilot-instructions.md" ".github/PULL_REQUEST_TEMPLATE.md" "apps/**/*.md" "docs/{architecture,operations,roadmaps,semantics}/**/*.md" "packages/**/*.{ts,md}" "registries/**/*.json" "rulesets/**/*.json" "runtimes/**/*.{json,md}" "schemas/**/*.json" "templates/**/*.{json,md}" "tooling/**/*.{js,mjs,ts,md}" "ARCHITECTURE.md" "CONTRIBUTING.md" "package.json" "tsconfig.json" > prettier.log 2>&1
          bunx prettier --parser json --write "registries/**/*.jsonld" >> prettier.log 2>&1
          status=$?
          git diff --binary > formatting.patch
          git diff --name-only > formatting-files.txt
          echo "$status" > prettier-exit.txt
          cat prettier.log
          exit 0
      - name: Upload formatting patch
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-formatting-patch
          path: |
            formatting.patch
            formatting-files.txt
            prettier.log
            prettier-exit.txt
          retention-days: 1
          if-no-files-found: error

  dependency-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate DOMPurify override patch
        run: |
          set +e
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "package.json";
          const manifest = JSON.parse(readFileSync(path, "utf8"));
          manifest.overrides = { ...manifest.overrides, dompurify: "3.4.12" };
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          bun install > dependency-update.txt 2>&1
          update_status=$?
          bun audit --prod > dependency-audit-after.txt 2>&1
          audit_status=$?
          git diff --binary -- bun.lock package.json > dependency-remediation.patch
          git diff --name-only -- bun.lock package.json > dependency-remediation-files.txt
          echo "$update_status" > dependency-update-exit.txt
          echo "$audit_status" > dependency-audit-after-exit.txt
          cat dependency-update.txt
          cat dependency-audit-after.txt
          exit 0
      - name: Upload dependency remediation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-remediation
          path: |
            dependency-remediation.patch
            dependency-remediation-files.txt
            dependency-update.txt
            dependency-update-exit.txt
            dependency-audit-after.txt
            dependency-audit-after-exit.txt
          retention-days: 1
          if-no-files-found: error

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run format:check:foundation
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test:run
      - uses: ./.github/actions/quirk-validate
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      - run: bun run test:e2e
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@56408e9a3f6d4f21fb6b1bf4fd7529dc366d7611 # v2.0.2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Capture dependency audit
        id: audit
        run: |
          set +e
          bun audit --prod > dependency-audit.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat dependency-audit.txt
          exit 0
      - name: Upload dependency audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: dependency-audit.txt
          retention-days: 7
          if-no-files-found: error
      - name: Enforce dependency audit
        if: ${{ steps.audit.outputs.exit_code != '0' }}
        run: exit 1
      - name: Secret scan
        uses: trufflesecurity/trufflehog@4d82f215b9ec0bf795ce9955054ec7da3c612ae5
        with:
          extra_args: --results=verified,unknown
